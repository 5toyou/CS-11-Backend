{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід в систему</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <div class="login-container">
        <h2>Login to CRM</h2>
        <form method="POST">
            {% csrf_token %}
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
            {% if already_logged_in %}
                <p>You are already logged in.</p>
                <a href="{% url 'main' %}">Go to Dashboard</a>
            {% endif %}
            <p>
                <label for="id_phone">Phone</label><br>
                <input type="text" name="phone" id="id_phone" required>
            </p>
            <p>
                <label for="id_password">Password</label><br>
                <input type="password" name="password" id="id_password" required>
            </p>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <a href="{% url 'register' %}">Teacher registration</a>
        </div>
    </div>
</body>
</html>
