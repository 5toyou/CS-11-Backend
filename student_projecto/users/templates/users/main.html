{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>
    <div class="sidebar">
        <h3>322 University</h3>
        <p>Welcome, <b>{{ request.user.phone }}</b></p>
        <p>Role: <span>{{ request.user.role }}</span></p>
        <hr>
        
        <a href="/api/lessons/">Schedule (API)</a>
        
        {% if request.user.role == 'ADMIN' %}
            <a href="/api/branches/">Manage Branches</a>
            <a href="/api/students/">Student Database</a>
            <a href="/api/subjects/">Subjects</a>
            <a href="/api/groups/">Groups</a>
            <a href="/api/schema/swagger-ui/">API Documentation (Swagger)</a>
        {% endif %}
    </div>

    <div class="content">
        <div class="header">
            <h2>Dashboard</h2>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </div>
    </div>
</body>
</html>
